<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Poker Dealer</title>
<meta name="description" content="Send a message to the Poker Dealer developer — questions, bugs, feedback.">
<link rel="canonical" href="https://pokerdealer.vip/contact/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pokerdealer.vip/contact/">
<meta property="og:title" content="Contact — Poker Dealer">
<meta property="og:description" content="Send a message to the Poker Dealer developer — questions, bugs, feedback.">
<meta property="og:image" content="https://pokerdealer.vip/assets/avatar-dealer-chip.png">
<link rel="icon" href="../assets/avatar-dealer-chip.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/analytics.js" defer></script>
<script src="../assets/contact.js" defer></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../">
      <img src="../assets/avatar-dealer-chip.png" alt="" width="32" height="32">
      Poker Dealer
    </a>
    <a class="lang-switch" href="../ru/contact/">RU</a>
  </div>
</header>

<main class="legal on-paper">
  <div class="wrap">
    <a class="legal-back" href="../">← Back to Poker Dealer</a>
    <h1>Contact</h1>
    <p>Questions, a bug, or feedback? Send it here, or message <strong>@PokerDealerAppBot</strong> directly on Telegram.</p>

    <form id="contact-form" class="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="c1fcfb6c-f85a-4897-8653-26428b520557">
      <input type="hidden" name="subject" value="Poker Dealer site · EN">
      <div class="visually-hidden" aria-hidden="true">
        <label>
          Leave this empty
          <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">
        </label>
      </div>

      <div class="form-field">
        <label for="contact-name">Name <span class="optional">(optional)</span></label>
        <input type="text" id="contact-name" name="name" autocomplete="name">
      </div>

      <div class="form-field">
        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" name="email" autocomplete="email" required>
      </div>

      <div class="form-field">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn-submit">Send</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Poker Dealer deals cards for home games. It doesn't handle money.</p>
    <div class="footer-links">
      <a href="../">Home</a>
      <a href="../privacy/">Privacy</a>
      <a href="../terms/">Terms</a>
      <a href="./">Contact</a>
      <a href="../ru/contact/">Русская версия</a>
    </div>
  </div>
</footer>

</body>
</html>
